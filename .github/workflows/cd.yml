name: CD - Local Pipeline Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-local-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: confluentinc/cp-kafka:7.9.0
        env:
          CLUSTER_ID: hxIhA6FCQGCXGd3JYTcMVA
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_NODE_ID: 1
          KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for PostgreSQL
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done'
          echo "PostgreSQL ready"

      - name: Setup database
        run: |
          pip install psycopg2-binary
          python3 scripts/setup_db.py

      - name: Test database connection
        run: |
          pip install psycopg2-binary
          python3 scripts/test_db.py

      - name: Run pipeline test
        run: |
          pip install psycopg2-binary
          python3 scripts/test_pipeline.py

      - name: Cleanup
        if: always()
        run: |
          python3 scripts/cleanup.py

  test-docker-compose:
    runs-on: ubuntu-latest
    needs: test-local-pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          cd docker
          docker compose config
          echo "Docker Compose valid"

      - name: Build services
        run: |
          cd docker
          docker compose build --quiet
          echo "Docker images built"
        continue-on-error: true

