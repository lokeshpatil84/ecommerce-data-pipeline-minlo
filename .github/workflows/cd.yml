name: CD - Local Pipeline Test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service_timeout:
        description: 'Timeout for service startup (seconds)'
        required: false
        default: '120'

jobs:
  test-local-pipeline:
    runs-on: ubuntu-latest
    # This job runs locally using Docker
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -e POSTGRES_INITDB_WALDIR=/var/lib/postgresql/wal
          
      kafka:
        image: confluentinc/cp-kafka:7.9.0
        env:
          CLUSTER_ID: hxIhA6FCQGCXGd3JYTcMVA
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_NODE_ID: 1
          KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:29092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start infrastructure
        run: |
          cd docker
          
          # Create necessary directories for volumes
          mkdir -p postgres/init
          
          # Create PostgreSQL init script
          cat > postgres/init/init.sql << 'EOF'
          -- Enable logical replication
          ALTER SYSTEM SET wal_level = logical;
          ALTER SYSTEM SET max_wal_senders = 10;
          ALTER SYSTEM SET max_replication_slots = 10;
          
          -- Create database
          CREATE DATABASE ecommerce;
          
          -- Connect to ecommerce and create schema
          \c ecommerce
          
          -- Create orders table
          CREATE TABLE IF NOT EXISTS ecommerce.orders (
              order_id SERIAL PRIMARY KEY,
              customer_id INTEGER NOT NULL,
              order_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              status VARCHAR(50) DEFAULT 'pending',
              total_amount DECIMAL(10,2) NOT NULL,
              shipping_address TEXT
          );
          
          -- Insert sample data
          INSERT INTO ecommerce.orders (customer_id, total_amount, status, shipping_address)
          VALUES 
              (1, 99.99, 'pending', '123 Main St'),
              (2, 149.50, 'processing', '456 Oak Ave'),
              (3, 75.00, 'shipped', '789 Pine Rd');
          EOF
          
          echo "✓ PostgreSQL init script created"

      - name: Wait for PostgreSQL to be ready
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done'
          echo "✓ PostgreSQL is ready"

      - name: Setup Kafka topic
        run: |
          # Wait for Kafka to be ready
          sleep 10
          
          # Create Kafka topic using kafka-topics.sh inside the container
          docker exec kafka kafka-topics.sh --bootstrap-server kafka:9092 --create --topic ecommerce.orders --partitions 1 --replication-factor 1 || true
          echo "✓ Kafka topic created"

      - name: Create MinIO and S3 compatible setup
        run: |
          # For local testing, create a local directory to simulate S3
          mkdir -p /tmp/warehouse
          echo "✓ Local warehouse directory created at /tmp/warehouse"

      - name: Test database connectivity
        run: |
          pip install psycopg2-binary
          python3 << 'EOF'
          import psycopg2
          import sys
          
          try:
              conn = psycopg2.connect(
                  host="localhost",
                  port=5432,
                  database="ecommerce",
                  user="postgres",
                  password="postgres123"
              )
              cursor = conn.cursor()
              cursor.execute("SELECT COUNT(*) FROM ecommerce.orders")
              count = cursor.fetchone()[0]
              cursor.close()
              conn.close()
              print(f"✓ Database connection successful")
              print(f"✓ Orders table has {count} records")
              sys.exit(0)
          except Exception as e:
              print(f"✗ Database connection failed: {e}")
              sys.exit(1)
          EOF

      - name: Run end-to-end pipeline test
        run: |
          pip install psycopg2-binary
          
          python3 << 'EOF'
          import psycopg2
          import time
          import random
          import sys
          
          print("🧪 Running E-Commerce Pipeline Test")
          print("=" * 50)
          
          try:
              # Connect to PostgreSQL
              conn = psycopg2.connect(
                  host="localhost",
                  port=5432,
                  database="ecommerce",
                  user="postgres",
                  password="postgres123"
              )
              cursor = conn.cursor()
              
              # Insert test orders
              statuses = ['pending', 'processing', 'shipped', 'delivered']
              test_count = 5
              
              for i in range(test_count):
                  customer_id = random.randint(1, 100)
                  total_amount = round(random.uniform(10, 1000), 2)
                  status = random.choice(statuses)
                  address = f"Test Address {random.randint(1, 1000)}"
                  
                  cursor.execute("""
                      INSERT INTO ecommerce.orders (customer_id, total_amount, status, shipping_address)
                      VALUES (%s, %s, %s, %s)
                      RETURNING order_id
                  """, (customer_id, total_amount, status, address))
                  
                  order_id = cursor.fetchone()[0]
                  conn.commit()
                  print(f"  Created order #{order_id}: ${total_amount} - {status}")
                  time.sleep(0.5)
              
              # Verify data
              cursor.execute("SELECT COUNT(*) FROM ecommerce.orders")
              total_count = cursor.fetchone()[0]
              
              cursor.execute("SELECT SUM(total_amount) FROM ecommerce.orders")
              total_revenue = cursor.fetchone()[0] or 0
              
              print()
              print("📊 Pipeline Test Results:")
              print(f"  - Total orders in database: {total_count}")
              print(f"  - Total revenue: ${total_revenue:,.2f}")
              
              cursor.close()
              conn.close()
              
              print()
              print("✓ Pipeline test completed successfully!")
              sys.exit(0)
              
          except Exception as e:
              print(f"✗ Pipeline test failed: {e}")
              sys.exit(1)
          EOF

      - name: Cleanup test data
        if: always()
        run: |
          python3 << 'EOF'
          import psycopg2
          
          try:
              conn = psycopg2.connect(
                  host="localhost",
                  port=5432,
                  database="ecommerce",
                  user="postgres",
                  password="postgres123"
              )
              cursor = conn.cursor()
              
              # Keep original 3 records, remove test data
              cursor.execute("DELETE FROM ecommerce.orders WHERE order_id > 3")
              deleted = cursor.rowCount
              conn.commit()
              
              print(f"✓ Cleaned up {deleted} test records")
              
              cursor.close()
              conn.close()
          except Exception as e:
              print(f"Cleanup warning: {e}")
          EOF

  test-docker-compose:
    runs-on: ubuntu-latest
    needs: test-local-pipeline
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose setup
        run: |
          # Test that docker-compose.yml is valid
          docker-compose -f docker/docker-compose.yml config
          echo "✓ Docker Compose configuration is valid"

      - name: Build services (dry run)
        run: |
          cd docker
          docker-compose build --quiet
          echo "✓ Docker images built successfully"
        continue-on-error: true

