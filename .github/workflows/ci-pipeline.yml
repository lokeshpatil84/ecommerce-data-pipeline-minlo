name: E-Commerce Pipeline CI (Simple)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup database
        run: |
          pip install psycopg2-binary
          python3 scripts/setup_db.py

      - name: Run pipeline test
        run: |
          pip install psycopg2-binary
          python3 scripts/test_pipeline.py

      - name: Cleanup
        if: always()
        run: |
          python3 scripts/cleanup.py

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          cd docker
          docker compose config
          echo "Docker Compose valid"

      - name: Validate JSON configs
        run: |
          python3 -c "import json; json.load(open('config/debezium-config.json'))"
          python3 -c "import json; json.load(open('config/kafka-topics.json'))"
          echo "JSON configs valid"

      - name: Validate Python files
        run: |
          python3 -m py_compile scripts/*.py glue-jobs/*.py
          echo "Python syntax valid"

